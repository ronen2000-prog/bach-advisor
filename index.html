<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5c6c42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="תמציות באך">
<title>יועץ תמציות באך</title>
<link rel="manifest" href="manifest.webmanifest?v=20260922080449">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=20260922080449">
<link rel="stylesheet" href="style.css?v=20260922080449">
<link rel="stylesheet" href="mobile.css?v=20260922080449">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14z"></path><path d="M5 19l8-8"></path></svg></div>
      <div class="brand-text">
        <div class="brand-title">יועץ תמציות באך</div>
        <span class="brand-subtitle">כלי עבודה למטפלים</span>
      </div>
    </div>
    <button id="newPatientBtn" class="btn btn-primary btn-block" type="button"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>מטופל חדש</button>
    <div class="patients-block">
      <span class="patient-list-label">מטופלים</span>
      <ul id="patientList" class="patient-list"></ul>
    </div>
    <div class="backup-block">
      <details class="backup-details">
        <summary class="patient-list-label">גיבוי נתונים</summary>
        <div class="backup-body">
          <div class="backup-actions">
            <button id="exportBackupBtn" class="btn btn-block" type="button">ייצוא גיבוי</button>
            <button id="importBackupBtn" class="btn btn-block" type="button">ייבוא גיבוי</button>
            <input type="file" id="importBackupInput" accept=".json,application/json" hidden>
          </div>
          <p class="backup-hint">הנתונים שמורים רק במכשיר הזה. מומלץ לייצא גיבוי מדי פעם.</p>
        </div>
      </details>
    </div>
  </aside>

  <main id="main" class="main">
    <div class="empty-state">
      <div class="empty-state-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14z"></path><path d="M5 19l8-8"></path></svg></div>
      <p>בחרו מטופל מהרשימה, או צרו מטופל חדש כדי להתחיל.</p>
    </div>
  </main>
</div>

<div id="printArea" class="print-area"></div>

<div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="false"></div>

<script src="bach-flowers.js?v=20260922080449"></script>
<script src="advisor-engine.js?v=20260922080449"></script>
<script src="local-store.js?v=20260922080449"></script>
<script src="local-api.js?v=20260922080449"></script>
<script src="backup.js?v=20260922080449"></script>
<script src="app.js?v=20260922080449"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js", { scope: "./" }).catch(() => {});
    });
  }
</script>
</body>
</html>
